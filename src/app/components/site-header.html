<header class="sticky top-0 z-30 px-3 pt-3 sm:px-6">
  <div
    class="mx-auto flex h-[60px] max-w-6xl items-center gap-2 rounded-2xl border border-white/60 bg-white/85 pl-3 pr-2 shadow-bar backdrop-blur-xl"
  >
    <button
      type="button"
      class="flex cursor-pointer items-center gap-2.5 rounded-xl py-1 pr-2"
      (click)="selectView('library')"
      aria-label="ไปยังหน้าคลังพรอมต์"
    >
      <span
        class="relative grid size-9 place-items-center overflow-hidden rounded-xl bg-gradient-to-br from-brand-400 to-brand-700 text-white shadow-glow"
      >
        <span class="absolute -top-2 -right-1 size-4 rounded-full bg-white/30 blur-[3px]" aria-hidden="true"></span>
        <app-icon name="sparkle" [size]="19" />
      </span>
      <span class="font-brand text-[17px] font-bold tracking-tight text-neutral-900">PromptBox</span>
    </button>

    <nav class="ml-2 hidden items-center md:flex" aria-label="เมนูหลัก">
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="view() === 'library'"
        (click)="selectView('library')"
      >
        คลังพรอมต์
      </button>
      <button
        type="button"
        class="nav-link"
        [class.nav-link-active]="view() === 'favorites'"
        (click)="selectView('favorites')"
      >
        รายการโปรด
        @if (favoritesCount() > 0) {
          <span class="badge">{{ favoritesCount() }}</span>
        }
      </button>
      <button type="button" class="nav-link" (click)="myPrompts()">พรอมต์ของฉัน</button>
    </nav>

    <div class="ml-auto flex items-center gap-1">
      <button type="button" class="btn-primary" (click)="createPrompt()">
        <app-icon name="pencil" [size]="15" />
        <span>สร้างพรอมต์</span>
      </button>
      <button
        type="button"
        class="btn-icon md:hidden"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'ปิดเมนู' : 'เปิดเมนู'"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      class="mx-auto mt-2 max-w-6xl rounded-2xl border border-neutral-200/80 bg-white/95 p-2 shadow-bar backdrop-blur-xl md:hidden"
      aria-label="เมนูหลักพกพา"
    >
      <button
        type="button"
        class="mobile-nav"
        [class.mobile-nav-active]="view() === 'library'"
        (click)="selectView('library')"
      >
        คลังพรอมต์
      </button>
      <button
        type="button"
        class="mobile-nav"
        [class.mobile-nav-active]="view() === 'favorites'"
        (click)="selectView('favorites')"
      >
        รายการโปรด
        @if (favoritesCount() > 0) {
          <span class="badge">{{ favoritesCount() }}</span>
        }
      </button>
      <button type="button" class="mobile-nav" (click)="myPrompts()">พรอมต์ของฉัน</button>
    </nav>
  }
</header>
