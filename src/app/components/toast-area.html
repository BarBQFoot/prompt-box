@if (toasts().length > 0) {
  <div
    class="pointer-events-none fixed inset-x-0 bottom-5 z-[70] flex flex-col items-center gap-2 px-4"
    aria-live="polite"
    aria-atomic="false"
  >
    @for (toast of toasts(); track toast.id) {
      <div
        class="pb-toast pointer-events-auto flex w-full max-w-md items-center gap-2.5 rounded-2xl bg-neutral-900/95 py-3 pr-2 pl-4 text-sm text-white shadow-2xl shadow-neutral-900/30 ring-1 ring-white/10 backdrop-blur"
        [class.pb-toast-out]="toast.closing"
      >
        <app-icon [name]="iconFor(toast.type)" [size]="19" [class]="colorFor(toast.type)" />
        <p class="flex-1 leading-relaxed">{{ toast.message }}</p>
        <button
          type="button"
          class="grid size-7 shrink-0 cursor-pointer place-items-center rounded-lg text-neutral-400 transition hover:bg-white/10 hover:text-white"
          aria-label="ปิดการแจ้งเตือน"
          (click)="dismiss(toast.id)"
        >
          <app-icon name="close" [size]="14" />
        </button>
      </div>
    }
  </div>
}
