<article
  class="pb-card-enter group relative flex h-full cursor-pointer flex-col overflow-hidden rounded-3xl border border-neutral-200/90 bg-white p-5 shadow-xs transition-all duration-300 hover:-translate-y-1.5 hover:border-brand-200 hover:shadow-lift"
  [style.animation-delay]="(index() % 12) * 55 + 'ms'"
  (click)="tryIt.emit(prompt())"
>
  <!-- hover light source -->
  <span
    class="pointer-events-none absolute -top-16 -right-10 size-44 rounded-full bg-gradient-to-br from-brand-100/80 to-lavender-100/40 opacity-0 blur-2xl transition-opacity duration-300 group-hover:opacity-100"
    aria-hidden="true"
  ></span>

  <div class="relative flex items-start justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <span
        class="grid size-10 place-items-center rounded-xl ring-1 ring-black/5 transition-transform duration-300 group-hover:scale-[1.06] group-hover:-rotate-3"
        [class]="meta().tile + ' ' + meta().text"
      >
        <app-icon [name]="meta().icon" [size]="20" />
      </span>
      <span class="text-xs font-semibold tracking-wide text-neutral-400">{{ meta().label }}</span>
    </div>
    <button
      type="button"
      class="fav-btn group/star"
      [class.pb-pop]="pop()"
      [class.fav-btn-active]="favorited()"
      [attr.aria-label]="favorited() ? 'เอาออกจากรายการโปรด' : 'เพิ่มในรายการโปรด'"
      [attr.aria-pressed]="favorited()"
      (animationend)="pop.set(false)"
      (click)="onToggleFavorite(); $event.stopPropagation()"
    >
      <app-icon [name]="favorited() ? 'star' : 'star-outline'" [size]="20" />
    </button>
  </div>

  <h3 class="mt-4 text-lg font-bold leading-snug tracking-tight text-neutral-900">
    <button
      type="button"
      class="font-display cursor-pointer text-left underline-offset-4 group-hover:text-brand-800 hover:underline"
      (click)="tryIt.emit(prompt()); $event.stopPropagation()"
    >
      {{ prompt().title }}
    </button>
  </h3>

  <p class="mt-1.5 line-clamp-2 text-sm leading-relaxed text-neutral-500">
    {{ prompt().description }}
  </p>

  <div class="mt-3.5 flex flex-wrap gap-1.5">
    @for (tag of visibleTags(); track tag) {
      <span class="tag">{{ tag }}</span>
    }
  </div>

  <div class="mt-auto pt-5">
    <span
      class="relative flex items-center justify-between rounded-xl border border-neutral-100 bg-neutral-50/80 px-3.5 py-2.5 text-sm font-semibold text-brand-700 transition-all duration-200 group-hover:border-brand-200 group-hover:bg-brand-50"
    >
      ลองใช้พรอมต์
      <app-icon
        name="arrow-right"
        [size]="16"
        class="transition-transform duration-200 group-hover:translate-x-1"
      />
    </span>
  </div>
</article>
