<article
  class="pb-card-enter group flex h-full cursor-pointer flex-col rounded-2xl border border-neutral-200 bg-white p-5 shadow-xs transition duration-200 hover:-translate-y-1 hover:border-brand-200 hover:shadow-lg"
  [style.animation-delay]="(index() % 12) * 50 + 'ms'"
  (click)="tryIt.emit(prompt())"
>
  <div class="flex items-start justify-between gap-3">
    <span class="category-chip">
      <app-icon [name]="meta().icon" [size]="14" />
      {{ meta().label }}
    </span>
    <button
      type="button"
      class="fav-btn group/star"
      [class.pb-pop]="pop()"
      [class.fav-btn-active]="favorited()"
      [attr.aria-label]="favorited() ? 'เอาออกจากรายการโปรด' : 'เพิ่มในรายการโปรด'"
      [attr.aria-pressed]="favorited()"
      (animationend)="pop.set(false)"
      (click)="onToggleFavorite(); $event.stopPropagation()"
    >
      <app-icon [name]="favorited() ? 'star' : 'star-outline'" [size]="20" />
    </button>
  </div>

  <h3 class="mt-3 text-base font-semibold text-neutral-900">
    <button
      type="button"
      class="cursor-pointer text-left underline-offset-4 hover:underline"
      (click)="tryIt.emit(prompt()); $event.stopPropagation()"
    >
      {{ prompt().title }}
    </button>
  </h3>

  <p class="mt-1.5 line-clamp-2 text-sm leading-relaxed text-neutral-500">
    {{ prompt().description }}
  </p>

  <div class="mt-3 flex flex-wrap gap-1.5">
    @for (tag of visibleTags(); track tag) {
      <span class="tag">{{ tag }}</span>
    }
  </div>

  <div class="mt-auto pt-5">
    <span
      class="inline-flex items-center gap-1 rounded-xl bg-brand-50 px-3.5 py-2 text-sm font-semibold text-brand-700 transition duration-150 group-hover:bg-brand-600 group-hover:text-white"
    >
      ลองใช้พรอมต์
      <app-icon name="arrow-right" [size]="15" />
    </span>
  </div>
</article>
