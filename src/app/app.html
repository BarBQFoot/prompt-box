<div
  class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-72 bg-gradient-to-b from-brand-50 via-lavender-100/50 to-transparent"
  aria-hidden="true"
></div>

<app-site-header [view]="view()" (viewChange)="switchView($event)" />

<main class="mx-auto w-full max-w-6xl px-4 sm:px-6">
  <app-library-page [mode]="view()" (openPrompt)="openBuilder($event)" (navigate)="switchView('library')" />
</main>

<footer class="pb-10 pt-4 text-center text-xs text-neutral-400">
  PromptBox เวอร์ชันสาธิต • พรอมต์ทั้งหมดเป็นข้อมูลตัวอย่างเพื่อการสาธิตการใช้งาน
</footer>

<app-prompt-builder [prompt]="builderPrompt()" (closed)="builderPrompt.set(null)" />
<app-toast-area />
